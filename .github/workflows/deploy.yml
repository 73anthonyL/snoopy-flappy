name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab
  workflow_dispatch:

# Least privilege: the default token can only read the repo, publish to Pages,
# and mint the OIDC token that Pages uses to verify where the deploy came from.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancel it, so the live site is
# never left half-published; newer pushes queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json records and fails if it
      # disagrees with package.json, so the deployed build is reproducible.
      - run: npm ci

      # Type check, lint, and formatting check: a build that fails any of them is not deployed
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo-name>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
